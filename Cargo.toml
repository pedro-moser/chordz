[package]
name = "chordz"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = ["dep:kira"]

[dependencies]
eframe = "0.31"
kira = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element"] }

[profile.dev]
opt-level = 1
